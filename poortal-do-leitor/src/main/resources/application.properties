spring.application.name=poortal-do-leitor

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/poortal_do_leitor}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never

# Cadastro inicial opcional, apenas quando ainda não existem usuários.
poortal.funcionario-inicial.nome=${POORTAL_FUNCIONARIO_NOME:}
poortal.funcionario-inicial.email=${POORTAL_FUNCIONARIO_EMAIL:}
poortal.funcionario-inicial.senha=${POORTAL_FUNCIONARIO_SENHA:}
